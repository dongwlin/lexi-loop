services:
  app:
    build:
      context: .
      args:
        # 透传宿主环境 VERSION（如 git describe 产物）；缺省 dev 占位。
        VERSION: ${VERSION:-dev}
    image: ${LEXI_IMAGE:-ghcr.io/dongwlin/lexi-loop}:${LEXI_IMAGE_TAG:-latest}
    ports:
      - "${LEXI_HTTP_PORT:-8080}:80"
    environment:
      LEXI_DATABASE_URL: postgres://lexiloop:lexiloop@db:5432/lexiloop?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    # 基础镜像一律全限定名：podman 默认强制短名称解析确认，无 TTY 会直接失败。
    image: docker.io/library/postgres:18-alpine
    environment:
      POSTGRES_USER: lexiloop
      POSTGRES_PASSWORD: lexiloop
      POSTGRES_DB: lexiloop
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexiloop -d lexiloop"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
