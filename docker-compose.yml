services:
  app:
    build:
      context: .
      args:
        # 透传宿主环境 VERSION（如 git describe 产物）；缺省 dev 占位。
        VERSION: ${VERSION:-dev}
    image: lexi-loop:latest
    ports:
      - "${LEXI_HTTP_PORT:-8080}:80"
    environment:
      LEXI_DATABASE_URL: postgres://lexiloop:lexiloop@db:5432/lexiloop?sslmode=disable
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: lexiloop
      POSTGRES_PASSWORD: lexiloop
      POSTGRES_DB: lexiloop
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lexiloop -d lexiloop"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  pgdata:
